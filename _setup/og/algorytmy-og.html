<!DOCTYPE html>
<!-- Source for algorytmy/og.png (link preview in Telegram, LinkedIn, Facebook…).
     Re-render: bash _setup/og/render.sh  — produces a 1200×630 PNG. Not deployed (_setup/ is excluded). -->
<html lang="uk">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&display=block" rel="stylesheet">
<style>
  :root { --bg:#0E0F11; --surface:#16181B; --border:#2A2D31; --text:#F1EFE8; --muted:#8B8E92; --green:#4F9D5F; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  body { font-family:'Roboto Flex', sans-serif; color:var(--text); position:relative; }

  /* faint grid + green glow, like a report page */
  .grid { position:absolute; inset:0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px; opacity:.35;
    mask-image: radial-gradient(ellipse 80% 90% at 85% 100%, #000 0%, transparent 70%); }
  .glow { position:absolute; width:720px; height:720px; right:-220px; bottom:-380px; border-radius:50%;
    background: radial-gradient(circle, rgba(79,157,95,.30), rgba(79,157,95,0) 65%); }
  .bar { position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--green); }

  .wrap { position:absolute; inset:0; padding:54px 72px 56px 82px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .top img { width:178px; height:auto; display:block; }
  .badge { font-family:'IBM Plex Sans'; font-weight:600; font-size:17px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text); border:1.5px solid var(--border); border-radius:4px; padding:9px 14px; }
  .badge b { color:var(--green); font-weight:700; }

  .eyebrow { margin-top:58px; font-family:'IBM Plex Sans'; font-weight:600; font-size:20px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--green); }
  h1 { margin-top:18px; font-family:'IBM Plex Sans'; font-weight:700; text-transform:uppercase;
    font-size:104px; line-height:.94; letter-spacing:-.02em; }
  h1 span { display:block; color:var(--green); }

  .bottom { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; gap:40px; }
  .lead { font-size:25px; line-height:1.4; color:var(--muted); max-width:640px; }
  .lead b { color:var(--text); font-weight:500; }
  .cta { flex:none; font-family:'IBM Plex Sans'; font-weight:700; font-size:19px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--green); color:var(--bg); border-radius:4px; padding:18px 26px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="bar"></div>
  <div class="wrap">
    <div class="top">
      <img src="../../images/logo.png" alt="Content Chameleon">
      <div class="badge">Безкоштовний гайд · <b>18+</b></div>
    </div>
    <div class="eyebrow">— Алгоритми LinkedIn · Листопад 2026</div>
    <h1>Знов ці<span>їб*чі алгоритми</span></h1>
    <div class="bottom">
      <p class="lead"><b>130+ сторінок звіту</b> переказали живою мовою: з&nbsp;цифрами, мораллю і&nbsp;матюками.</p>
      <div class="cta">Забрати гайд →</div>
    </div>
  </div>
</body>
</html>
