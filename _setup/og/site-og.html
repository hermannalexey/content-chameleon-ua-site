<!DOCTYPE html>
<!-- Source for images/og/*.png (site-wide link previews). Card is picked by the URL hash, e.g. site-og.html#sales.
     Re-render: bash _setup/og/render-site.sh. Not deployed (_setup/ is excluded). -->
<html lang="uk">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&display=block" rel="stylesheet">
<style>
  :root { --bg:#0E0F11; --surface:#16181B; --border:#2A2D31; --text:#F1EFE8; --muted:#8B8E92; --green:#4F9D5F; --accent:var(--green); }
  body.purple { --accent:#8f82c4; } body.teal { --accent:#6fb0ba; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; background:var(--bg); }
  body { font-family:'Roboto Flex', sans-serif; color:var(--text); position:relative; }

  /* faint grid + green glow, like a report page */
  .grid { position:absolute; inset:0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 60px 60px; opacity:.35;
    mask-image: radial-gradient(ellipse 80% 90% at 85% 100%, #000 0%, transparent 70%); }
  .glow { position:absolute; width:720px; height:720px; right:-220px; bottom:-380px; border-radius:50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent), transparent 65%); }
  .bar { position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--accent); }

  .wrap { position:absolute; inset:0; padding:54px 72px 56px 82px; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .top img { width:178px; height:auto; display:block; }
  .badge { font-family:'IBM Plex Sans'; font-weight:600; font-size:17px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text); border:1.5px solid var(--border); border-radius:4px; padding:9px 14px; }
  .badge b { color:var(--accent); font-weight:700; }

  .eyebrow { margin-top:58px; font-family:'IBM Plex Sans'; font-weight:600; font-size:20px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent); }
  h1 { margin-top:18px; font-family:'IBM Plex Sans'; font-weight:700; text-transform:uppercase;
    font-size:104px; line-height:.94; letter-spacing:-.02em; }
  h1 span { display:block; color:var(--accent); }

  .bottom { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; gap:40px; }
  .lead { font-size:25px; line-height:1.4; color:var(--muted); max-width:640px; }
  .lead b { color:var(--text); font-weight:500; }
  .cta { flex:none; font-family:'IBM Plex Sans'; font-weight:700; font-size:19px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--accent); color:var(--bg); border-radius:4px; padding:18px 26px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="bar"></div>
  <div class="wrap">
    <div class="top">
      <img src="../../images/logo.png" alt="Content Chameleon">
      <div class="badge" id="badge"></div>
    </div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <div class="bottom">
      <p class="lead" id="lead"></p>
      <div class="cta" id="cta"></div>
    </div>
  </div>
<script>
const CARDS = {
  home: { badge:'LinkedIn · B2B', eyebrow:'— LinkedIn-агенція для B2B-компаній', h1:'B2B-клієнти<span>через LinkedIn</span>',
    lead:'Для <b>українських компаній, що продають на&nbsp;Захід</b>: впізнаваність у&nbsp;ніші і&nbsp;персональна розсилка.', cta:'Від $1&nbsp;500/міс' },
  sales: { badge:'Лідогенерація', eyebrow:'— Клієнти з LinkedIn', h1:'Зустрічі<span>із Заходом</span>',
    lead:'З покупцями, які <b>вже знають, хто ви</b>: нетворк, видимість і&nbsp;розсилка руками, без автоматизації.', cta:'Від $1&nbsp;500/міс' },
  brand: { cls:'teal', badge:'Особистий бренд', eyebrow:'— Особистий бренд у LinkedIn', h1:'Вас знають<span>до дзвінка</span>',
    lead:'Пости <b>вашим голосом</b> з&nbsp;щотижневих інтервʼю. Один із&nbsp;клієнтів виріс з&nbsp;21 до&nbsp;22&nbsp;145 підписників.', cta:'Від $500/міс' },
  storytelling: { cls:'purple', badge:'Курс', eyebrow:'— Курс Ксенії Куци', h1:'Сторітел<span>та хуки</span>',
    lead:'Пости, які <b>дочитують</b>: показувати, а&nbsp;не пояснювати, і&nbsp;писати перше речення, на&nbsp;якому зупиняються.', cta:'Дивитися курс →' },
  interviews: { cls:'purple', badge:'Курс', eyebrow:'— Курс Євгена Гайдученка', h1:'Інтерв’ю<span>з експертом</span>',
    lead:'Як дістати з&nbsp;фаундера <b>матеріал для сильного контенту</b>. 300+ інтервʼю за&nbsp;6&nbsp;років.', cta:'Дивитися курс →' },
};
const c = CARDS[location.hash.slice(1)] || CARDS.home;
if (c.cls) document.body.classList.add(c.cls);
for (const k of ['badge','eyebrow','h1','lead','cta']) document.getElementById(k).innerHTML = c[k];
</script>
</body>
</html>
